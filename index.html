<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Explorer Pro - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin-top: 20px;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="message">
        <h1>Galaxy Explorer Pro</h1>
        <p>Loading the universe... Please wait</p>
        <p><small>If you're not redirected automatically, <a href="/galaxy-explorer-pro/index.html" style="color: #4da6ff;">click here</a>.</small></p>
    </div>

    <script>
        // Redirect to the main application after a short delay
        setTimeout(function() {
            window.location.href = "/galaxy-explorer-pro/index.html";
        }, 2000);
    </script>
</body>
</html>
