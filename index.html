<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Explorer Pro</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.ico" sizes="32x32" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f0f0f0;
        color: #333;
        font-family: 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #3498db;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: #333;
        font-size: 1.2em;
        margin-top: 20px;
        text-align: center;
        max-width: 80%;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .loading-text {
          font-size: 1em;
        }
      }
    </style>
  <script type="module" crossorigin src="/galaxy-explorer-pro/assets/main-BbpsAucP.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h1>Galaxy Explorer Pro</h1>
        <p>Use mouse to rotate, scroll to zoom, right-click to pan</p>
    </div>

    <div id="loading">
        <div class="loader"></div>
        <p>Loading the universe...</p>
    </div>

</body>
</html>
