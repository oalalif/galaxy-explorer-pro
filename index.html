<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="3D Galaxy Explorer - Explore the universe in your browser">
    <meta name="keywords" content="3D, Galaxy, Space, Explorer, Three.js, WebGL">
    <meta name="author" content="Galaxy Explorer Team">
    <meta name="theme-color" content="#000000">
    
    <title>Galaxy Explorer Pro</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icon-192x192.png">
    <link rel="apple-touch-icon" href="assets/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="assets/icon-192x192.png">
    <meta name="msapplication-config" content="browserconfig.xml">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oalalif.github.io/galaxy-explorer-pro/">
    <meta property="og:title" content="Galaxy Explorer Pro">
    <meta property="og:description" content="3D Galaxy Explorer - Explore the universe in your browser">
    <meta property="og:image" content="https://oalalif.github.io/galaxy-explorer-pro/assets/icon-512x512.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://oalalif.github.io/galaxy-explorer-pro/">
    <meta property="twitter:title" content="Galaxy Explorer Pro">
    <meta property="twitter:description" content="3D Galaxy Explorer - Explore the universe in your browser">
    <meta property="twitter:image" content="https://oalalif.github.io/galaxy-explorer-pro/assets/icon-512x512.png">
    
    <!-- SEO -->
    <link rel="canonical" href="https://oalalif.github.io/galaxy-explorer-pro/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f0f0f0;
        color: #333;
        font-family: 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #3498db;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: #333;
        font-size: 1.2em;
        margin-top: 20px;
        text-align: center;
        max-width: 80%;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .loading-text {
          font-size: 1em;
        }
      }
    </style>
    <script type="module" src="/src/js/main.js"></script>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <h1>Galaxy Explorer Pro</h1>
        <p>Use mouse to rotate, scroll to zoom, right-click to pan</p>
    </div>

    <div id="loading">
        <div class="loader"></div>
        <p>Loading the universe...</p>
    </div>

</body>
</html>
